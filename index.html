    /* 주의가 필요한 항목만 펼침·강조: 받은 대기/보류(응답 필요), 보낸 보류(다시 요청 가능).
       보낸 "거절"은 급한 게 아니고 거절 메시지가 길어 → 접힌 채로(요약줄의 '거절됨' 칩만), 눌러서 펼쳐 보게 함 */

    return (

  /* 나에게 온 "주선자 요청" 승인/거절 섹션 (주선자든 일반 회원이든 요청을 받으면 보이게) */

      rows + '</div>';

  function handleRevokePhotoViewer(otherId) {

  /* 대화 연결 회수: 나와 상대 사이 승인된 대화(번호) 요청을 해제 → 서로 채팅 불가 */
  function handleRevokeContactLink(otherId) {

  /* 연결 회수: 나와 상대 사이 사진·대화 권한을 한 번에 해제 */
  function handleRevokeConnection(otherId) {

    var nick = nickForEntry(currentState, otherId);
    modalConfirm('연결 회수', nick + '님과의 사진·대화 연결을 모두 해제할까요? 서로 사진·채팅을 할 수 없게 돼요. (다시 요청·수락하면 재연결)', '회수', 'danger').then(function (ok) {

            var between = (r.fromId === me.id && r.toId === otherId) || (r.fromId === otherId && r.toId === me.id);
            if (!between) return r;
            var c = JSON.parse(JSON.stringify(r));
            if (c.approved) c.approved = false;
            if (c.userApproved) c.userApproved = false;
            if (c.fromRevealed) c.fromRevealed = false;

          });

  /* 메시지함 연결 리스트: 사진/대화 권한이 있는 상대를 한 줄씩, 상태를 버튼 4개로 표시.

      function btn(active, label, action, extra) {

        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">' +
          '<span style="font-variant-numeric:tabular-nums;color:var(--muted);font-size:0.78rem;">' + escapeHtml(formatUid(x) || '—') + '</span>' +
          '<button type="button" data-action="card-detail" data-id="' + escapeHtml(x.id) + '" style="display:inline-flex;align-items:center;gap:4px;border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:0.92rem;font-weight:700;cursor:pointer;font-family:inherit;">👤 ' + escapeHtml(x.nickname) + ' <span style="font-weight:400;font-size:0.78rem;color:var(--muted);">프로필</span></button>' +

        '<div style="display:flex;gap:5px;flex-wrap:wrap;">' +

        '<h3>🔗 내 연결<span class="count">' + rows.length + '</span></h3>' +
        '<p class="sub" style="margin:0 0 6px;">사진·대화 권한이 있는 상대예요. 이름=프로필 · 파란 버튼이 현재 상태(누르면 회수) · 💬 대화는 채팅으로 이어져요.</p>' +
        body +
      '</div>';
  }

    /* 주선자 계정으로 로그인했으면 "주선자 홈(관리)" 블록을 만들어 둠 → 본인 메시지함 위에 얹는다 */
    var authMM = isMatchmakerEntry(myAuthEntry(state));
    var mmHome = '';
    if (authMM) {
      var subPend = (state.pendingEntries || []).filter(function (e) { return e.managedBy === currentUser.id; });
      /* 친구 목록·전환은 위 "누구로 활동할까요" 전환창이 대신함. 여기선 승인 대기 친구만 간단히 표시 */

        : '';
      var mmThread = threadFor(state, currentUser.id, 'user');
      var joinSection = joinRequestSectionHtml(state, true); /* 주선자는 항상 표시 */
      /* 🔔 친구들 소식: 주선자로 있어도 친구에게 온 알림(요청·승인·관리자 메시지)을 바로 보고 그 친구로 전환 */
      var mmFriends = entriesManagedByMe(state).filter(function (e) { return !e.ownerSelf; })
        .sort(function (a, b) { return (a.submittedAt || '').localeCompare(b.submittedAt || ''); });
      var newsRows = mmFriends.map(function (f) {
        var un = userUnread(state, f);
        var incPend = (state.dateRequests || []).filter(function (r) { return r.toId === f.id && (r.hiddenBy || []).indexOf(f.id) < 0 && reqStatus(r) === 'pending'; }).length;
        var isMale = f.gender === 'male';
        var bg = isMale ? '#e8f2fd' : '#fdeaf1';   /* 남=하늘 · 여=핑크 */

        var bits = [];

        return '<button type="button" data-action="switch-profile" data-id="' + escapeHtml(f.id) + '" ' +

            '<span style="font-weight:800;font-size:1.02rem;">' + (isMale ? '💙' : '💗') + ' ' + escapeHtml(f.nickname) + ' <span style="font-weight:400;font-size:0.78rem;color:var(--muted);">' + genderLabel(f.gender) + '</span></span>' +
            '<span style="font-size:0.85rem;">' + status + '</span>' +
          '</span>' +
          '<span class="card-btn' + (hot ? ' primary' : '') + '" style="flex:none;pointer-events:none;' + (hot ? '' : 'background:#fff;') + '">' + (hot ? '📬 보기' : '열기') + '</span>' +
        '</button>';
      }).join('');
      var newsTotal = mmFriends.reduce(function (a, f) { return a + userUnread(state, f); }, 0);
      var friendsNews = mmFriends.length
        ? '<div class="mine-section" style="margin-top:26px;"><h3 style="font-size:1.2rem;margin-bottom:6px;">🤝 친구 선택</h3>' +
            '<p class="sub" style="margin:0 0 10px;">관리할 친구를 눌러 바로 전환하세요. 새 소식이 있으면 강조돼요.</p>' +
            newsRows + '</div>'
        : '<div class="mine-section" style="margin-top:26px;"><h3 style="font-size:1.2rem;margin-bottom:6px;">🤝 친구 선택</h3><p class="sub" style="margin:0;">아직 소개한 친구가 없어요. 위 <b>🔄 누구로 활동할까요 → ＋추가</b>로 친구를 소개할 수 있어요.</p></div>';
      mmHome =
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">' +
            '<h2 style="margin:0 0 4px;">🤝 주선자 홈</h2>' +
            '<button type="button" class="card-btn" id="convert-member" style="flex:none;">🙋 일반 계정으로 전환</button>' +
          '</div>' +
          '<div class="my-uid">' + escapeHtml(currentUser.nickname) + ' · 주선자</div>' +
          pendNote +
          friendsNews +
          joinSection +
          '<details class="mine-section"' + (mmThread.length ? ' open' : '') + '>' +
            '<summary style="cursor:pointer;font-weight:700;list-style:revert;">💬 관리자 메시지<span class="count">' + mmThread.length + '</span></summary>' +
            '<div style="margin-top:8px;">' +
              (mmThread.length ? mmThread.map(function (m) { return msgLineHtml(m, 'user'); }).join('') : '<p class="sub" style="margin:0;">아직 없어요.</p>') +
              '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">' +
                '<button type="button" class="card-btn primary" id="member-msg-open" style="flex:none;">✍️ 관리자에게 메시지</button>' +
                (mmThread.length ? '<button type="button" class="card-btn" id="member-msg-delall" style="flex:none;">전체 삭제</button>' : '') +
              '</div>' +
            '</div></details>' +
          '<div class="mine-section" style="margin-top:14px;"><button type="button" class="card-btn danger" id="delete-mm" style="flex:none;">🗑 주선자 계정 삭제</button>' +
            '<p class="sub" style="margin:6px 0 0;">계정과 내 소개팅 프로필을 삭제해요. (관리 중인 친구가 있으면 먼저 정리해야 해요)</p></div>';
    }
    /* Case A: 주선자 계정 자체로 보고 있음(본인 미전환/미등록) → 관리 홈만 */
    if (isMatchmakerEntry(me)) {
      var ownExists = (state.entries || []).some(function (e) { return e.managedBy === currentUser.id && e.ownerSelf; });
      var selfNote = ownExists ? '' : '<div class="mine-section"><p class="sub" style="margin:0;">🙋 아직 본인 소개팅 프로필이 없어요. 상단 "신청서 작성 → 본인"에서 등록하면 여기 함께 표시돼요.</p></div>';
      return '<div class="admin-panel">' + mmHome + selfNote + '</div>';
    }
    var reqs = state.dateRequests || [];
    var groups = [
      { key: 'in', title: '📥 받은 요청', incoming: true },
      { key: 'out', title: '📤 보낸 요청', incoming: false }
    ];
    var sections = groups.map(function (g) {
      var items = reqs.filter(function (r) {
        if ((r.hiddenBy || []).indexOf(me.id) >= 0) return false;
        var mine = g.incoming ? r.toId === me.id : r.fromId === me.id;
        if (!mine) return false;
        var st0 = reqStatus(r);
        if (st0 === 'approved' || st0 === 'user_approved') return false; /* 승인된 건 아래 "내 연결"로 이동 */
        return true;
      }).sort(function (a, b) { return (b.submittedAt || '').localeCompare(a.submittedAt || ''); });
      /* 응답이 필요한 항목: 받은=대기/보류, 보낸=보류/거절 → 이런 게 있으면 기본 펼침 */
      var needCnt = items.filter(function (r) {
        var st = reqStatus(r);
        return g.incoming ? (st === 'pending' || st === 'held') : (st === 'held' || st === 'rejected');
      }).length;
      var inner = items.length
        ? items.map(function (r) { return reqRowHtml(r, state, g.incoming); }).join('')
        : '<p class="sub" style="margin:0;">아직 없어요.</p>';
      /* 5개 초과면 스크롤 */
      var body = items.length > 5
        ? '<div style="max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;">' + inner + '</div>'
        : inner;
      /* 기본 펼침: 응답 필요 항목이 있거나, 1~5개로 적을 때. 그 외(0개 또는 6개+ 조용함)는 접힘 */
      var openByDefault = items.length > 0; /* 요청이 있으면 기본 펼침 */
      var needBadge = needCnt ? '<span class="need-badge">응답 ' + needCnt + '</span>' : '';
      return (
        '<details class="mine-section"' + (openByDefault ? ' open' : '') + '>' +
          '<summary style="cursor:pointer;font-weight:700;list-style:revert;">' + g.title + '<span class="count">' + items.length + '</span>' + needBadge + '</summary>' +
          '<div style="margin-top:8px;">' + body + '</div>' +
        '</details>'
      );
    }).join('');
    /* 숨긴(내역 삭제한) 요청 복구 — 삭제는 완전삭제가 아니라 숨김이라 되돌릴 수 있음 */
    var _hiddenMine = reqs.filter(function (r) { return (r.fromId === me.id || r.toId === me.id) && (r.hiddenBy || []).indexOf(me.id) >= 0; }).length;
    if (_hiddenMine) sections += '<div class="mine-section" style="text-align:right;padding:2px 0;"><button type="button" class="card-btn" data-action="restore-hidden" style="flex:none;background:var(--card);color:var(--muted);font-size:0.82rem;">🗑 숨긴 내역 ' + _hiddenMine + '건 복구</button></div>';
    var thread = threadFor(state, me.id, 'user');
    var hasUnreadAdmin = thread.some(function (m) { return m.from === 'admin' && (m.at || '') > (me.mineSeenAt || ''); });
    var msgBody = thread.length
      ? thread.map(function (m) { return msgLineHtml(m, 'user'); }).join('')
      : '<p class="sub" style="margin:0;">아직 관리자와 주고받은 메시지가 없어요.</p>';
    var msgSection =
      '<details class="mine-section"' + (hasUnreadAdmin ? ' open' : '') + '>' + /* 새 관리자 메시지 있을 때만 펼침, 아니면 접힘(공간 절약) */
        '<summary style="cursor:pointer;font-weight:700;list-style:revert;">💬 관리자 메시지<span class="count' + (hasUnreadAdmin ? ' blink' : '') + '">' + thread.length + '</span></summary>' +
        '<div style="margin-top:8px;">' +
          msgBody +
          '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">' +
            '<button type="button" class="card-btn primary" id="member-msg-open" style="flex:none;">✍️ 관리자에게 메시지</button>' +
            (thread.length ? '<button type="button" class="card-btn" id="member-msg-delall" style="flex:none;">전체 삭제</button>' : '') +
          '</div>' +
        '</div>' +
      '</details>';
    /* Case B: 주선자의 "본인" 프로필로 보고 있음 → 주선자 홈(위) + 본인 메시지함(아래) 합쳐서 */
    if (authMM && me.ownerSelf && me.managedBy === currentUser.id) {
      return (
        '<div class="admin-panel">' +
          mmHome +
          '<hr class="perforation">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">' +
            '<h2 style="margin:12px 0 4px;">🙋 내 소개팅 (본인)</h2>' +
            '<button type="button" class="card-btn primary" data-action="card-detail" data-id="' + escapeHtml(me.id) + '" style="flex:none;">👤 내 프로필 보기</button>' +
          '</div>' +
          '<div class="my-uid">고유번호 ' + escapeHtml(formatUid(me) || '—') + '</div>' +
          '<p class="sub">내 소개팅 프로필로 받고 보낸 요청이에요.</p>' +
          sections +
          connectionsSummaryHtml(state, me) +
        '</div>'
      );
    }
    var isSubProfile = isProxyEntry(me); /* me가 대리(sub) 프로필인가 */
    var viaMatchmaker = !!actingAs && actingAs !== currentUser.id; /* 주선자가 전환해서 보는 중 */
    var actingBanner = viaMatchmaker
      ? '<div class="readonly-note" style="background:var(--gold-soft);border-color:var(--gold);">🤝 지금 <b>' + escapeHtml(me.nickname) + '</b>님(내가 소개한 친구)으로 활동 중이에요. 위 프로필 전환에서 <b>내 프로필</b>로 돌아갈 수 있어요.</div>'
      : (isSubProfile ? '<div class="readonly-note" style="background:var(--gold-soft);border-color:var(--gold);">🤝 <b>' + escapeHtml(me.nickname) + '</b>님, 주선자가 소개해 준 후보들을 둘러보고 마음에 드는 분께 요청을 보내보세요.</div>' : '');
    /* 메시지함 오른쪽 버튼 (상황별) */
    var headBtns = '';
    if (viaMatchmaker && !me.ownerSelf) {
      /* 주선자가 친구(sub)로 전환해서 볼 때: 1일 임시 PIN 발급/연장 + 독립(일반) 계정 전환 */
      var pinOn = me.pinAuth && !subPinExpired(me);
      var pinBtn = pinOn
        ? '<button type="button" class="card-btn approve" data-action="sub-pin-manage" data-id="' + escapeHtml(me.id) + '" style="flex:none;" title="눌러서 연장/회수">🔑 임시 PIN (' + escapeHtml(subPinUntilText(me)) + ')</button>'
        : '<button type="button" class="card-btn" data-action="sub-pin-issue" data-id="' + escapeHtml(me.id) + '" style="flex:none;">🔑 1일 PIN 발급</button>';
      headBtns = '<button type="button" class="card-btn primary" data-action="card-detail" data-id="' + escapeHtml(me.id) + '" style="flex:none;">👤 내 프로필 보기</button>' +
        '<button type="button" class="card-btn" data-action="sub-detach" data-id="' + escapeHtml(me.id) + '" style="flex:none;">🪪 일반 계정 전환</button>' +
        pinBtn;
    } else if (isSubProfile) {
      /* 친구(sub)가 임시 PIN으로 직접 로그인한 경우: 프로필 수정 + 만료 시각 표시 */
      headBtns = '<button type="button" class="card-btn primary" data-action="card-detail" data-id="' + escapeHtml(me.id) + '" style="flex:none;">👤 내 프로필 보기</button>';
      if (me.pinAuth && !subPinExpired(me)) {
        headBtns += '<span class="chip" style="background:#e6f4ea;color:#137333;align-self:center;">🔑 임시 로그인 ' + escapeHtml(subPinUntilText(me)) + ' (' + escapeHtml(subPinRemainText(me)) + ')</span>';
      }
    } else if (!isSubProfile) {
      /* 일반/주선자 본인 계정: 주선자 요청(내가 관리하는 사람이 없을 때만) + 친구 대신 소개 */
      var iManage = entriesManagedByMe(state).length > 0;
      var amMM = isMatchmakerEntry(myAuthEntry(state));
      var myJoinReq = (state.joinRequests || []).find(function (j) { return j.fromId === me.id; });
      var reqBtn = (amMM || iManage) ? ''
        : (myJoinReq
            ? '<button type="button" class="card-btn" id="cancel-mm-req" style="flex:none;">⏳ 주선자 승인 대기 (취소)</button>'
            : '<button type="button" class="card-btn" id="request-mm" style="flex:none;">🤝 주선자 요청</button>');
      headBtns = '<button type="button" class="card-btn primary" data-action="card-detail" data-id="' + escapeHtml(me.id) + '" style="flex:none;">👤 내 프로필 보기</button>' +
        reqBtn + '<button type="button" class="card-btn" id="start-proxy" style="flex:none;">🤝 주선자 계정으로 전환</button>' +
        (!me.deleteRequested ? '<button type="button" class="card-btn" data-action="report-couple" data-id="' + escapeHtml(me.id) + '" style="flex:none;background:#fce4ec;border-color:#f4a9c7;color:#c2185b;font-weight:700;">💕 좋은 인연 만났어요</button>' : '');
    }
    return (
      '<div class="admin-panel">' +
        (headBtns ? '<div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;">' + headBtns + '</div>' : '') +
        '<div class="my-uid" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">고유번호 ' + escapeHtml(formatUid(me) || '—') + '</div>' +
        actingBanner +
        '<p class="sub">' + escapeHtml(me.nickname) + '님, 반가워요! 받은 요청은 직접 승인하거나 거절할 수 있어요.</p>' +
        (me.deleteRequested ? '<div class="mine-note reject" style="margin-top:10px;">🗑 삭제 요청이 접수되어 <b>관리자 확인 중</b>이에요. <button type="button" class="card-btn" data-action="cancel-delete" data-id="' + escapeHtml(me.id) + '" style="flex:none;padding:4px 12px;margin-left:8px;">삭제 요청 취소</button></div>' : '') +
        (me.deactivateRequested ? '<div class="mine-note" style="margin-top:10px;background:var(--gold-soft);border-color:var(--gold);">🗄 비활성화(보관) 요청이 접수되어 <b>관리자 확인 중</b>이에요. <button type="button" class="card-btn" data-action="cancel-deactivate" data-id="' + escapeHtml(me.id) + '" style="flex:none;padding:4px 12px;margin-left:8px;">요청 취소</button></div>' : '') +
        (me.deactivated ? '<div class="mine-note" style="margin-top:10px;background:var(--gold-soft);border-color:var(--gold);">🗄 <b>보관 상태</b>예요 (명단에 노출되지 않아요). 복구는 상단 <b>💬 Q&amp;A</b>로 문의하거나 카카오톡으로 요청해 주세요.</div>' : '') +
        (isSubProfile ? '' : msgSection) + /* 관리자 메시지를 맨 위로 */
        (isSubProfile ? '' : joinRequestSectionHtml(state, false)) + /* 나에게 온 주선자 요청 있으면 표시 */
        sections +
        connectionsSummaryHtml(state, me) +
      '</div>'
    );
  }

  /* 관리자 사용량 현황: 누적 요약 + 최근 7일(가입/사진/대화) 추이. 신뢰 가능한 필드(submittedAt/type/status)만 사용 */
  function usageStatsHtml(state) {
    var entries = state.entries || [];
    var pending = state.pendingEntries || [];
    var reqs = state.dateRequests || [];
    var cand = entries.filter(function (e) { return !e.isMatchmaker; }); /* 명단 후보(래퍼 제외) */
    var gGeneral = cand.filter(function (e) { return !e.managedBy; }).length;
    var gFriend = cand.filter(function (e) { return e.managedBy && !e.ownerSelf; }).length;
    var gOwnerSelf = cand.filter(function (e) { return e.managedBy && e.ownerSelf; }).length;
    var mmCount = entries.filter(function (e) { return e.isMatchmaker; }).length;
    var delReq = entries.filter(function (e) { return e.deleteRequested; }).length;
    function reqStat(type) {
      var list = reqs.filter(function (r) { return (r.type || 'contact') === type; });
      var ap = 0, rj = 0, wait = 0;
      list.forEach(function (r) { var s = reqStatus(r); if (s === 'approved') ap++; else if (s === 'rejected') rj++; else wait++; });
      return { total: list.length, ap: ap, rj: rj, wait: wait };
    }
    var photo = reqStat('photo'), talk = reqStat('contact');
    var connNow = reqs.filter(function (r) { return (r.type || 'contact') === 'contact' && r.approved; }).length;
    var connEverShown = Array.isArray(state.connLog) ? state.connLog.length : Math.max((typeof state.connEver === 'number' ? state.connEver : 0), connNow);
    var row = function (lbl, val, sub) {
      return '<tr><td class="lbl">' + lbl + '</td><td><b>' + val + '</b>' + (sub ? ' <span class="stats-sub">' + sub + '</span>' : '') + '</td></tr>';
    };
    var summary =
      '<table class="stats-table">' +
        '<tr><th style="text-align:left;">구분</th><th>수</th></tr>' +
        row('명단 회원(후보)', cand.length, '일반 ' + gGeneral + '·친구 ' + gFriend + '·주선자본인 ' + gOwnerSelf) +
        row('주선자 계정', mmCount, '') +
        row('승인 대기', pending.length, '') +
        row('삭제요청 대기', delReq, '') +
        row('📷 사진 요청', photo.total, '대기 ' + photo.wait + '·승인 ' + photo.ap + '·거절 ' + photo.rj) +
        row('💌 대화 신청', talk.total, '대기 ' + talk.wait + '·승인 ' + talk.ap + '·거절 ' + talk.rj) +
        '<tr><td class="lbl">🔗 누적 연결</td><td><b>' + connEverShown + '</b>쌍' +
          ' <span class="stats-sub">현재 연결 ' + connNow + ' · 해제해도 유지 · 요청함에서 대화 요청 완전삭제 시 감소</span></td></tr>' +
      '</table>';
    /* 일자별 추이 (KST) — 첫 활동일부터 오늘까지 전체. 최신 날짜가 위로 오게 정렬, 세로 스크롤(약 7일 노출) */
    var candDays = cand.map(function (e) { return e.submittedAt ? kstDay(e.submittedAt) : ''; }).filter(Boolean);
    var todayD = kstDay(new Date().toISOString());
    var allDates = candDays.slice();
    reqs.forEach(function (r) { if (r.submittedAt) allDates.push(kstDay(r.submittedAt)); });
    var earliest = allDates.length ? allDates.reduce(function (a, b) { return a < b ? a : b; }) : todayD;
    function addDay(dstr, n) { var d = new Date(dstr + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    var days = [], d = earliest, guard = 0;
    while (d <= todayD && guard++ < 1000) { days.push(d); d = addDay(d, 1); } /* 오래된→최신 */
    var byDay = {};
    days.forEach(function (dd) { byDay[dd] = { join: 0, photo: 0, talk: 0 }; });
    candDays.forEach(function (dd) { if (byDay[dd]) byDay[dd].join++; });
    reqs.forEach(function (r) { if (r.submittedAt) { var dd = kstDay(r.submittedAt); if (byDay[dd]) { if ((r.type || 'contact') === 'photo') byDay[dd].photo++; else byDay[dd].talk++; } } });
    var trendRows = days.slice().reverse().map(function (dd) { /* 최신 날짜가 위로 */
      var c = byDay[dd]; var md = dd.slice(5).replace('-', '/');
      var cum = candDays.filter(function (x) { return x <= dd; }).length; /* 그 날까지 가입한 현재 회원 누적 */
      return '<tr><td class="lbl">' + md + '</td><td><b>' + cum + '</b></td><td>' + c.join + '</td><td>' + c.photo + '</td><td>' + c.talk + '</td></tr>';
    }).join('');
    var trend =
      '<div class="stats-scroll" style="max-height:270px;overflow-y:auto;"><table class="stats-table stats-trend">' +
        '<thead><tr><th style="text-align:left;">날짜</th><th>누적 회원</th><th>가입</th><th>📷사진</th><th>💌대화</th></tr></thead>' +
        '<tbody>' + trendRows + '</tbody>' +
      '</table></div>';
    return '<details class="admin-fold" data-sec="usage"' + secOpenAttr('usage', false) + '><summary>📊 사용량 통계</summary>' +
      '<div class="admin-fold-body">' + summary +
      '<p class="stats-sub" style="margin:10px 0 4px;">일자별 추이 (최신순 · 누적 회원=그 날까지 가입한 현재 회원, 가입=신규 프로필, 신청=보낸 날 기준)</p>' + trend +
      '<p class="stats-sub" style="margin-top:6px;">※ 탈퇴한 회원은 집계에 없어 누적은 현재 회원 기준이에요. 승인/탈퇴 시점은 별도로 기록되지 않아요.</p>' +
      '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);"><div style="font-weight:700;font-size:0.95rem;margin-bottom:8px;">📈 가입 추이</div>' + signupTrendBody(state) + '</div>' +
      '</div></details>';
  }
  /* 🔗 연결 이력: 대화 승인 기록(누가↔누구, 승인 시각, 연결중/해제됨) + 누적 연결 수 보정. connLog 기반 */

    var log = (state.connLog || []).slice().sort(function (a, b) { return (b.at || '').localeCompare(a.at || ''); });

            '<button type="button" class="card-btn" data-action="card-detail" data-id="' + escapeHtml(e.a) + '" style="flex:none;">👤 ' + escapeHtml(nick(e.a).split(' ').slice(1).join(' ') || nick(e.a)) + '</button>' +
            '<button type="button" class="card-btn" data-action="card-detail" data-id="' + escapeHtml(e.b) + '" style="flex:none;">👤 ' + escapeHtml(nick(e.b).split(' ').slice(1).join(' ') || nick(e.b)) + '</button>' +
            (on ? '' : '<button type="button" class="card-btn danger" data-action="connlog-del" data-id="' + escapeHtml(e.id) + '" style="flex:none;">🗑 기록 삭제</button>') +
          '</div>' +
        '</div></div>' +
      '</details>';
    }).join('');
    var body =
      '<p class="sub">대화 승인으로 맺어진 연결 기록이에요(=공개 배너의 <b>누적 연결</b>). <b>연결 중 ' + active + '</b> · 해제됨 ' + revoked + '<br>연결을 <b>해제</b>하면 여기 <b>해제됨</b>으로 남고 누적 숫자는 유지돼요. 누적에서 빼려면 <b>요청함</b>에서 그 대화 요청을 <b>완전삭제</b>하거나, 요청함에 없는 과거 해제분은 <b>해제됨 항목의 [🗑 기록 삭제]</b>로 여기서 바로 빼세요.</p>' +
      (log.length ? rows : '<p class="sub">아직 기록된 연결이 없어요. (이 기능 도입 이후의 대화 승인부터 쌓여요)</p>');
    return '<details class="admin-fold" data-sec="connlog"' + secOpenAttr('connlog', false) + '><summary>🔗 연결 이력<span class="pending-count">' + log.length + '</span></summary><div class="admin-fold-body">' + body + '</div></details>';

  /* 가입 추이 그래프 (사용량 통계 안에 삽입): 회원·주선자·전체(테스트 제외) 누적선. 데이터=entries.submittedAt (활동기록과 무관) */
  function signupTrendBody(state) {
    function kd(iso) { return new Date(new Date(iso).getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10); }
    var all = (state.entries || []).concat(state.pendingEntries || []);
    var rows = all.filter(function (e) { return e.submittedAt && !e.testAccount; }).map(function (e) { return { day: kd(e.submittedAt), mm: !!e.isMatchmaker }; });
    var body;
    if (!rows.length) {
      return '<p class="sub">아직 가입 데이터가 없어요.</p>';
    }
    var memD = {}, mmD = {};
    rows.forEach(function (r) { if (r.mm) mmD[r.day] = (mmD[r.day] || 0) + 1; else memD[r.day] = (memD[r.day] || 0) + 1; });
    var first = rows.map(function (r) { return r.day; }).sort()[0];
    var todayK = kd(new Date().toISOString());
    var series = [];
    (function () { var d = new Date(first + 'T00:00:00Z'), end = new Date(todayK + 'T00:00:00Z'); while (d <= end) { series.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); } })();
    var cM = 0, cX = 0, full = series.map(function (day) { cM += (memD[day] || 0); cX += (mmD[day] || 0); return { day: day, member: cM, mm: cX, total: cM + cX }; });
    var last = full[full.length - 1];
    var win = full;
    if (adminSignupPeriod === 'custom' && (adminSignupStart || adminSignupEnd)) {
      var lo = adminSignupStart || '0000-00-00', hi = adminSignupEnd || '9999-99-99';
      win = full.filter(function (p) { return p.day >= lo && p.day <= hi; });
      if (!win.length) win = full.slice(-1); /* 범위에 데이터 없으면 최소 1점 */
    } else if (adminSignupPeriod === '7') win = full.slice(-7);
    else if (adminSignupPeriod === '30') win = full.slice(-30);
    /* SVG 좌표 계산 */
    var W = 560, H = 240, padL = 34, padR = 14, padT = 14, padB = 30, n = win.length;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var top = 0; win.forEach(function (p) { if (p.total > top) top = p.total; });
    var niceTop = Math.max(5, Math.ceil(top / 5) * 5);
    function X(i) { return n > 1 ? (padL + i * (plotW / (n - 1))) : (padL + plotW / 2); }
    function Y(v) { return (padT + (1 - v / niceTop) * plotH).toFixed(1); }
    function dl(d) { var p = d.split('-'); return parseInt(p[1], 10) + '/' + parseInt(p[2], 10); }
    var svg = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="가입 누적 추이 선그래프">'];
    [0, 0.5, 1].forEach(function (f) { var v = Math.round(niceTop * f), yy = Y(v); svg.push('<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="#EADFD3"/><text x="' + (padL - 6) + '" y="' + (Number(yy) + 3) + '" text-anchor="end" font-size="9" fill="#a99e95">' + v + '</text>'); });
    var lstep = Math.ceil(n / 8);
    win.forEach(function (p, i) { if (i % lstep === 0 || i === n - 1) svg.push('<text x="' + X(i).toFixed(1) + '" y="' + (H - padB + 15) + '" text-anchor="middle" font-size="9" fill="#a99e95">' + dl(p.day) + '</text>'); });
    function poly(key, color, w, dash) {
      var pts = win.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p[key]); }).join(' ');
      svg.push('<polyline fill="none" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="6 4"' : '') + ' stroke-linejoin="round" stroke-linecap="round" points="' + pts + '"/>');
      var li = n - 1; svg.push('<circle cx="' + X(li).toFixed(1) + '" cy="' + Y(win[li][key]) + '" r="' + (w >= 3 ? 3.5 : 3) + '" fill="' + color + '"/>');
    }
    poly('member', '#C08A34', 2, false);
    poly('mm', '#2E8B57', 2, true);
    poly('total', '#B23A48', 3, false);
    svg.push('</svg>');
    function card(lbl, val, color) { return '<div style="flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 10px;"><div style="font-size:0.72rem;color:var(--muted);">' + lbl + '</div><div style="font-size:1.25rem;font-weight:800;color:' + color + ';">' + val + '</div></div>'; }
    var _spOpts = [['all', '전체'], ['30', '30일'], ['7', '7일']];
    var _dateInput = 'padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:0.82rem;background:var(--paper);color:var(--ink);';
    var periodRow = '<div style="display:flex;align-items:center;gap:6px;margin:0 0 6px;flex-wrap:wrap;"><span style="font-weight:700;font-size:0.86rem;">기간</span>' +
      _spOpts.map(function (o) { return '<button type="button" class="card-btn' + (adminSignupPeriod === o[0] ? ' primary' : '') + '" data-action="signup-period" data-key="' + o[0] + '" style="flex:none;padding:5px 12px;font-size:0.82rem;">' + o[1] + '</button>'; }).join('') +
      '<button type="button" class="card-btn' + (adminSignupPeriod === 'custom' ? ' primary' : '') + '" data-action="signup-period" data-key="custom" style="flex:none;padding:5px 12px;font-size:0.82rem;">직접</button>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap;font-size:0.82rem;color:var(--muted);">' +
        '<input type="date" id="signup-start" value="' + escapeHtml(adminSignupStart) + '" min="' + first + '" max="' + todayK + '" style="' + _dateInput + '">' +
        '<span>~</span>' +
        '<input type="date" id="signup-end" value="' + escapeHtml(adminSignupEnd) + '" min="' + first + '" max="' + todayK + '" style="' + _dateInput + '">' +
        (adminSignupPeriod === 'custom' ? '<button type="button" class="card-btn" data-action="signup-period" data-key="all" style="flex:none;padding:4px 10px;font-size:0.78rem;">✕ 초기화</button>' : '') +
      '</div>';
    var legend = '<div style="display:flex;gap:14px;margin:2px 0 6px;font-size:0.76rem;color:var(--muted);flex-wrap:wrap;">' +
      '<span style="display:flex;align-items:center;gap:5px;"><span style="width:16px;border-top:3px solid #B23A48;"></span>전체</span>' +
      '<span style="display:flex;align-items:center;gap:5px;"><span style="width:16px;border-top:3px solid #C08A34;"></span>회원</span>' +
      '<span style="display:flex;align-items:center;gap:5px;"><span style="width:16px;border-top:3px dashed #2E8B57;"></span>주선자</span></div>';
    body = '<p class="sub" style="margin:0 0 8px;">시작일부터 오늘까지 · 테스트 제외 · 누적</p>' +
      '<div style="display:flex;gap:8px;margin-bottom:10px;">' + card('전체', last.total, 'var(--accent)') + card('회원', last.member, 'var(--gold)') + card('주선자', last.mm, '#2E8B57') + '</div>' +
      periodRow + legend + svg.join('');
    return body;
  }

  function renderAdmin(state) {
    if (!isAdminUnlocked) {

  /* ---- 서버 용량 ---- */
  var DOC_LIMIT = 1048576; /* Firestore 문서 1개 최대 1MiB */

           더보기/접기 버튼은 항상 첫 줄(첫 친구) 오른쪽에. +추가는 마지막 친구 아래 줄. */
        var canFold = friendSubs.length >= 2;
        var childChips;
        if (!canFold) {
          /* 친구 1명: 그 프로필 오른쪽에 +추가 (2명+의 더보기 위치와 동일) · 0명: +추가만 */
          if (chipList.length === 1) childChips = line(chipList[0].html + addBtn);
          else childChips = line(addBtn);
        } else if (!switcherExpanded) {
          /* 접힘: 선택된 친구(없으면 첫 번째) 한 명 + 오른쪽 "더보기" */
          var actives = chipList.filter(function (c) { return c.on; });
          var head = actives.length ? actives[0].html : chipList[0].html;
          childChips = line(head + '<button type="button" class="pf-switch-chip pf-switch-fold" data-action="ps-toggle">더보기 ▾</button>');
        } else {
          /* 펼침: 첫 줄=첫 친구+접기, 나머지 친구 세로, 마지막에 +추가 */
          childChips = line(chipList[0].html + '<button type="button" class="pf-switch-chip pf-switch-fold" data-action="ps-toggle">접기 ▴</button>') +
            chipList.slice(1).map(function (c) { return line(c.html); }).join('') +
            line(addBtn);
        }
        switcher = '<div class="profile-switch">' +
            '<span class="ps-label">🔄 누구로 활동할까요? <span class="ps-hint">눌러서 전환</span></span>' +
            '<div class="ps-tree">' + ownerRow + '<div class="ps-children" id="ps-children">' + childChips + '</div>' +
            '</div>' +
          '</div>';
      }
    }
    /* 헤더 로그인/PIN 버튼 상태: 회원 로그인 ↔ 관리자 로그인은 한 번에 하나만 노출.
       - 회원 로그인 중: 관리자 버튼 숨기고 그 자리에 'PIN 변경' (로그인 계정이 본인 소유일 때만)
       - 관리자 로그인 중: 회원 로그인 버튼 숨김 */
    var authE = myAuthEntry(state);
    var canChangePin = !!(currentUser && authE && !authE.managedBy);
    /* 배너 '알림' 버튼: 새 소식 개수 (있으면 깜빡, 누르면 새 소식 팝업) */
    var newsCount = 0;
    try { if (currentUser || isAdminUnlocked) newsCount = collectNews(state).items.length; } catch (e) {}
    var panel;
    if (activeTab === 'list') panel = renderList(state);
    else if (activeTab === 'mmlist' && isAdminUnlocked) panel = renderMatchmakers(state);
    else if (activeTab === 'mine' && currentUser) panel = renderMine(state);
    else if (activeTab === 'admin' && isAdminUnlocked) panel = renderAdmin(state);
    else panel = renderForm(state);
    return (
      '<div class="masthead"><div class="masthead-inner">' +
        '<div class="masthead-icon">' + ICON_LOGO + '</div>' +
        '<div><h1 id="masthead-title" title="새로고침" style="cursor:pointer;">베니브릿지</h1>' +
          '<p class="masthead-sub">아는 사람이 건넨 🔗링크로 연결되는, 신뢰 기반 커뮤니티예요.</p></div>' +
      '</div>' +
      '<div class="admin-bar">' +
        /* 1줄: 인사말·공지사항 / 친구에게 공유 */
        '<div class="admin-bar-row">' +
          '<button type="button" class="admin-link" id="show-notice" style="background:#1a73e8;border-color:#1a73e8;color:#fff;opacity:1;font-weight:700;">&#128227; 인사말·공지사항</button>' +
          '<button type="button" class="admin-link" id="copy-url" style="background:#1a73e8;border-color:#1a73e8;color:#fff;opacity:1;font-weight:700;">&#128279; 친구에게 공유</button>' +
        '</div>' +
        /* 2줄: 관리자 커피 사주기 / Q&A */
        '<div class="admin-bar-row">' +
          '<button type="button" class="admin-link" id="buy-coffee" style="background:var(--gold-soft);border-color:var(--gold);color:var(--gold);opacity:1;font-weight:700;">&#9749; 관리자 커피 사주기</button>' +
          '<button type="button" class="admin-link" id="feedback-btn" style="background:#FEE500;border-color:#FEE500;color:#3C1E1E;opacity:1;font-weight:700;">&#128172; Q&amp;A</button>' +
        '</div>' +
        /* 3줄: 홈에 추가 / 알림 / 로그인 */
        '<div class="admin-bar-row">' +
          ((NOTIF_ENABLED && !isStandalone()) ? '<button type="button" class="admin-link" id="add-home">&#128241; 홈에 추가</button>' : '') +
          ((currentUser || isAdminUnlocked)
            ? '<button type="button" class="admin-link' + (newsCount ? ' news-hot' : '') + '" id="news-btn">&#128276; 알림' + (newsCount ? ' <b>' + newsCount + '</b>' : '') + '</button>'
            : '') +
          (currentUser
            ? '<button type="button" class="admin-link unlocked" id="user-logout">' + ICON_UNLOCK + ' 로그아웃</button>' +
              (canChangePin ? '<button type="button" class="admin-link" id="header-change-pin">&#128273; PIN 변경</button>' : '')
            : (isAdminUnlocked
                ? '<button type="button" class="admin-link unlocked" id="admin-toggle">' + ICON_UNLOCK + ' 관리자 해제</button>'
                : '<button type="button" class="admin-link" id="user-login">' + ICON_LOCK + ' 로그인</button>')) +
        '</div>' +
      '</div></div>' +
      heldBanner +
      liveBanner +
      ((NOTIF_ENABLED && currentUser && !memberNotifActive())
        ? '<div class="notice-bar">' +
            '<span class="notice-icon">&#128227;</span> 요청이 오거나 승인·거절되면 알림으로 알려드려요. 상단 <b>&#128276; 알림</b> → <b>알림 설정</b>에서 켜보세요!' +
          '</div>'
        : '') +
      '<div class="page">' +
        '<div class="sticky-head">' +
          '<div class="tabs" role="tablist">' + tabs + '</div>' +
          (adminTab ? '<div class="tabs tabs--admin" role="tablist">' + adminTab + '</div>' : '') +
          (activeTab === 'form' ? '' : switcher) + /* 신청서 작성 탭에선 전환창 숨김 (어차피 주선자 계정으로 작성) */
        '</div>' +
        '<div id="tab-panel">' + panel + '</div>' +
      '</div>'
    );
  }

  /* 현재 패널의 모든 폴딩 섹션/카드 전체 펼치기·접기 토글 (하나라도 접혀 있으면 전체 펼침) */
  function toggleFoldAll() {
    var ds = document.querySelectorAll('#tab-panel details.admin-fold');
    if (!ds.length) return;
    var anyClosed = false;
    for (var i = 0; i < ds.length; i++) { if (!ds[i].open) { anyClosed = true; break; } }
    for (var j = 0; j < ds.length; j++) {
      ds[j].open = anyClosed;
      var sk = ds[j].getAttribute('data-sec');   /* 관리자 섹션: 상태 유지 */
      if (sk) adminSecOpenMap()[sk] = anyClosed;
      var mk = ds[j].getAttribute('data-mm');     /* 주선자 카드: 상태 유지 */
      if (mk) _mmFoldOpen[mk] = anyClosed;
    }
    try { saveAdminSecOpen(); } catch (e) {}
  }
  /* ---- state & paint ---- */
  /* 명단 검색: 화면을 다시 그리지 않고 이미 렌더된 카드만 즉석에서 숨김/표시 (한글 조합 안전) */
  function applyListSearch() {
    var q = (listSearch || '').toLowerCase().replace(/\s+/g, ' ').trim();
    var tokens = q ? q.split(' ') : []; /* 공백으로 나눠 각 단어가 모두 포함되면 매칭(순서 무관) */
    var nodes = document.querySelectorAll('.roster-grid .pf-card[data-search], .compact-list .compact-row[data-search]');
    var shown = 0;
    for (var i = 0; i < nodes.length; i++) {
      var blob = nodes[i].getAttribute('data-search') || '';
      var match = tokens.every(function (t) { return blob.indexOf(t) >= 0; });
      nodes[i].style.display = match ? '' : 'none';
      if (match) shown++;
    }
    var cnt = document.getElementById('search-count');
    if (cnt) cnt.textContent = q ? (nodes.length ? (shown + '명 검색됨' + (shown === 0 ? ' — 일치하는 회원이 없어요.' : '')) : '') : '';
  }
  /* 회원 명단 검색: 화면 재렌더 없이 행만 즉석 숨김/표시 (한글 조합·포커스 유지) */
  function applySeenSearch() {
    var q = (seenSearch || '').toLowerCase().replace(/\s+/g, ' ').trim();
    var tokens = q ? q.split(' ') : [];
    var rows = document.querySelectorAll('.seen-table tr[data-seensearch]');
    for (var i = 0; i < rows.length; i++) {
      var blob = rows[i].getAttribute('data-seensearch') || '';
      rows[i].style.display = tokens.every(function (t) { return blob.indexOf(t) >= 0; }) ? '' : 'none';
    }
  }
  /* 주선자 탭 검색: 카드만 즉석 숨김/표시 (재렌더 없이) */
  function applyMmSearch() {
    var q = (mmSearch || '').toLowerCase().replace(/\s+/g, ' ').trim();
    var tokens = q ? q.split(' ') : [];
    var cards = document.querySelectorAll('#tab-panel details.admin-fold[data-mmsearch]');
    for (var i = 0; i < cards.length; i++) {
      var blob = cards[i].getAttribute('data-mmsearch') || '';
      cards[i].style.display = tokens.every(function (t) { return blob.indexOf(t) >= 0; }) ? '' : 'none';
    }
  }
  /* 요청함 검색: 요청 행만 즉석 숨김/표시 (재렌더 없이 → 포커스·한글조합 유지) */
  function applyReqSearch() {
    var q = (adminReqSearch || '').toLowerCase().replace(/\s+/g, ' ').trim();
    var tokens = q ? q.split(' ') : [];
    var rows = document.querySelectorAll('.req-fold[data-reqsearch]');
    var shown = 0;
    for (var i = 0; i < rows.length; i++) {
      var blob = rows[i].getAttribute('data-reqsearch') || '';
      var vis = tokens.every(function (t) { return blob.indexOf(t) >= 0; });
      rows[i].style.display = vis ? '' : 'none';
      if (vis) shown++;
    }
    var emptyNote = document.getElementById('req-search-empty');
    if (emptyNote) emptyNote.hidden = !(q && rows.length && shown === 0);
  }
  function paint(state) {
    currentState = state;
    document.getElementById('app').innerHTML = renderApp(state);
    try { applyListSearch(); } catch (e) {} /* 검색어가 있으면 재적용 */
    try { applySeenSearch(); } catch (e) {} /* 회원 명단 검색 재적용 */
    try { applyMmSearch(); } catch (e) {} /* 주선자 탭 검색 재적용 */
    try { applyReqSearch(); } catch (e) {} /* 요청함 검색 재적용 */
    try {
      var items = document.querySelectorAll('.admin-msg-item');
      for (var i = 0; i < items.length; i++) {
        if (openMsgFolds[items[i].getAttribute('data-eid')]) items[i].open = true;
      }
    } catch (e) {}
    try { applyLogFilter(); } catch (e) {} /* 활동기록 필터 재적용 */
    try { adjustSwitcherClip(); } catch (e) {} /* 전환창 친구 2줄 초과 시 접기 */
    try { updateCharCounts(); } catch (e) {} /* 자기소개 등 글자수 카운터 */
    maybeRestoreDraft();
  }

  /* 실시간 스냅샷으로 인한 전체 리페인트를 코얼레싱 — 활동 회원이 많을 때 스냅샷이 몰려도
     ~400ms에 최신 상태로 1회만 다시 그림. (관리자 본인 조작은 핸들러가 직접 paint() 호출 → 즉시)
     잦은 리페인트로 아이폰이 렉 걸리고, <img>가 로드 전에 DOM이 갈려 사진이 안 뜨던 문제 완화. */
  var _paintTimer = null, _firstPainted = false;
  function _doSnapPaint() {
    var st = currentState;
    decryptAllAdminData(st).then(function () {
      if (isEditingForm()) return; /* 폼 작성 중이면 유지 */
      paint(st);
    }).catch(function () {});
  }
  function schedulePaint() {
    if (!_firstPainted) { _firstPainted = true; _doSnapPaint(); return; } /* 첫 렌더는 즉시(빈 화면 방지) */
    if (_paintTimer) return; /* 이미 예약됨 → 마지막(currentState) 기준으로 1회만 */
    _paintTimer = setTimeout(function () { _paintTimer = null; _doSnapPaint(); }, 400);
  }

  /* 신청서를 작성 중이면(포커스/입력/사진 있음) 배경 갱신으로 화면을 다시 그리지 않음
     — 다른 사람 활동으로 인한 실시간 갱신이 입력 중인 폼을 지우는 문제 방지 */
  function isEditingForm() {
    if (activeTab !== 'form') return false;
    var form = document.getElementById('entry-form');
    if (!form) return false;
    if (form.contains(document.activeElement)) return true;
    if (photoDataUrls && photoDataUrls.length) return true;
    var fields = form.querySelectorAll('input, textarea, select');
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) return true; }
      else if ((el.value || '').trim()) return true;
    }
    return false;
  }

  /* ---- 신청서 임시 저장 (새로고침/이동/오류로도 안 날아가게) ---- */
  var DRAFT_KEY = 'form-draft-v1';
  function saveDraft() {
    if (editingEntryId || proxyRegisterMode || formRole !== 'self') return; /* 신규 본인 신청서 작성만 (수정·대리등록·주선자등록 제외) */
    var form = document.getElementById('entry-form');
    if (!form) return;
    try {
      var g = function (n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
      var radio = function (n) { var el = form.querySelector('[name="' + n + '"]:checked'); return el ? el.value : ''; };
      var draft = {
        nickname: g('nickname'), realName: g('realName'), contact: g('contact'),
        gender: radio('gender'), birthYear: g('birthYear'), region: g('region'),
        workplace: g('workplace'), referrerText: g('referrerText'), degreeChoice: radio('degreeChoice'),
        height: g('height'), intro: g('intro'), idealType: g('idealType'), dealbreaker: g('dealbreaker'),
        photos: (photoDataUrls || []).slice(), savedAt: Date.now()
      };
      /* PIN은 민감정보라 저장하지 않음 */
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    } catch (e) {}
  }
  function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  function draftHasContent(d) {
    return !!(d && (d.nickname || d.realName || d.contact || d.region || d.workplace ||
      d.intro || d.idealType || d.dealbreaker || d.height || d.birthYear ||
      d.gender || d.degreeChoice || (d.photos && d.photos.length)));
  }
  function maybeRestoreDraft() {
    if (editingEntryId || proxyRegisterMode || formRole !== 'self') return; /* 본인 신청서에서만 복원 (주선자 등록·대리 제외) */
    var form = document.getElementById('entry-form');
    if (!form) return;
    var nick = form.querySelector('[name="nickname"]');
    if (!nick || nick.value) return; /* 이미 채워져 있으면 건드리지 않음 */
    var d = loadDraft();
    if (!draftHasContent(d)) return;
    var setVal = function (n, v) { var el = form.querySelector('[name="' + n + '"]'); if (el && v) el.value = v; };
    setVal('nickname', d.nickname); setVal('realName', d.realName); setVal('contact', d.contact);
    setVal('birthYear', d.birthYear); setVal('region', d.region); setVal('workplace', d.workplace);
    setVal('referrerText', d.referrerText); if (d.referrerText) { try { setReferrerField(d.referrerText); } catch (e) {} } setVal('height', d.height);
    setVal('intro', d.intro); setVal('idealType', d.idealType); setVal('dealbreaker', d.dealbreaker);
    if (d.gender) { var gr = form.querySelector('[name="gender"][value="' + d.gender + '"]'); if (gr) gr.checked = true; }
    if (d.degreeChoice) { var dr = form.querySelector('[name="degreeChoice"][value="' + d.degreeChoice + '"]'); if (dr) dr.checked = true; }
    if (d.photos && d.photos.length) { photoDataUrls = d.photos.slice(); renderPhotoThumbs(); }
    var lede = form.parentNode.querySelector('.form-lede');
    if (lede && !document.getElementById('draft-restored-note')) {
      var note = document.createElement('div');
      note.id = 'draft-restored-note';
      note.className = 'readonly-note';
      note.style.cssText = 'background:var(--gold-soft);border-color:var(--gold);margin-top:10px;';
      note.innerHTML = '&#128190; 작성 중이던 내용을 불러왔어요. <button type="button" class="card-btn" id="draft-clear" style="margin-left:8px;padding:4px 12px;">새로 쓰기</button>';
      lede.parentNode.insertBefore(note, lede.nextSibling);
    }
  }

  function saveState(state) {
    currentState = state;
    return stateRef.set(JSON.parse(JSON.stringify(state)));
  }

  function decryptAllAdminData(state) {
    if (!isAdminUnlocked || !adminPrivateKey) return Promise.resolve();
    var promises = [];
    (state.entries || []).forEach(function (entry) {
      if (entry.contactEnc && !decryptedContacts[entry.id]) {
        promises.push(decryptWithAdmin(adminPrivateKey, entry.contactEnc).then(function (v) { decryptedContacts[entry.id] = v; }).catch(function () {}));
      }
      /* 실명도 미리 복호화해 캐시 → 관리자 명단 검색(이름/전화)에 사용 */
      if (entry.realNameEnc && !decryptedNames[entry.id]) {
        promises.push(decryptWithAdmin(adminPrivateKey, entry.realNameEnc).then(function (v) { decryptedNames[entry.id] = v; }).catch(function () {}));
      }
    });
    (state.dateRequests || []).forEach(function (req) {
      if (!decryptedRequests[req.id] && req.ciphertext) {
        promises.push(decryptWithAdmin(adminPrivateKey, { iv: req.iv, ciphertext: req.ciphertext, wrappedKey: req.wrappedKey }).then(function (v) { decryptedRequests[req.id] = v; }).catch(function () {}));
      }
    });
    return Promise.all(promises);
  }

  /* ---- event handlers ---- */
  function handleAdminToggle() {
    var state = currentState;
    if (isAdminUnlocked) {
      isAdminUnlocked = false;
      adminPrivateKey = null;
      decryptedContacts = {};
      decryptedNames = {};
      decryptedRequests = {};
      clearAdminPin();
      if (activeTab === 'admin') activeTab = 'form';
      paint(state);
      return;
    }
    if (!state.adminAuth) {
      modalPinSetup().then(function (r) {
        if (!r) return;
        var pwErr = adminPwError(r.p1);
        if (pwErr) return modalNotice('오류', pwErr);
        if (r.p1 !== r.p2) return modalNotice('오류', '비밀번호가 일치하지 않아요.');
        setupAdminPin(r.p1).then(function (auth) {
          state.adminAuth = auth;
          return saveState(state).then(function () {
            return unlockAdminKey(r.p1, auth);
          });
        }).then(function (key) {
          adminPrivateKey = key;
          isAdminUnlocked = true; requestNotifPermission();
          saveAdminPin(r.p1);
          return decryptAllAdminData(state);
        }).then(function () {
          paint(state);
        });
      });
      return;
    }
    modalPin('관리자 인증', '비밀번호를 입력하세요.', { password: true }).then(function (pin) {
      if (!pin) return;
      unlockAdminKey(pin, state.adminAuth).then(function (key) {
        adminPrivateKey = key;
        isAdminUnlocked = true;
        saveAdminPin(pin);
        return decryptAllAdminData(state);
      }).then(function () {
        paint(state);
      }).catch(function () {
        modalNotice('오류', '비밀번호가 올바르지 않아요.');
      });
    });
  }

  function handleChangeAdminPw() {
    var state = currentState;
    if (!isAdminUnlocked || !adminPrivateKey || !state.adminAuth) {
      return modalNotice('안내', '관리자 모드에서만 변경할 수 있어요.');
    }
    modalPinSetup().then(function (r) {
      if (!r) return;
      var pwErr = adminPwError(r.p1);

    modalConfirm('다시 활성화', msg, '활성화', 'approve').then(function (ok) {
      if (!ok) return;
      (needReset ? makePinAuth('1234') : Promise.resolve(null)).then(function (auth) {
        return db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var entries = (s.entries || []).map(function (e) {
              if (e.id !== id) return e;
              var c = JSON.parse(JSON.stringify(e));
              delete c.deactivated; delete c.testAccount; delete c.deactivatedReason; delete c.deactivatedAt;
              if (wasManaged) { delete c.managedBy; delete c.ownerSelf; }
              if (auth) { c.pinAuth = auth; delete c.pinHash; delete c.pinExpiresAt; }
              return c;
            });
            tx.update(stateRef, { entries: entries });
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', '다시 활성화' + (needReset ? '(일반 전환·PIN 1234)' : '') + ' · ' + entry.nickname);
        return refreshNow();
      }).then(function () {
        modalNotice('활성화 완료', entry.nickname + '님을 다시 명단에 노출했어요.' + (needReset ? ' 로그인 PIN은 1234예요 — 본인에게 알려주고 변경하도록 안내해 주세요.' : ''));
      }).catch(function (err) { modalNotice('오류', '활성화 실패: ' + (err.message || err)); });
    });
  }

  function handleRequest(toId, type) {
    var state = currentState;
    if (!state.adminAuth) { modalNotice('안내', '관리자 설정이 아직 완료되지 않았어요.'); return; }
    var target = state.entries.find(function (e) { return e.id === toId; });
    if (!target) return;
    var isPhoto = type === 'photo';
    var typeLabel = isPhoto ? '사진 보기' : '대화 신청';
    var actionText = isPhoto ? '사진 보기 요청' : '대화 신청';
    requireLogin().then(function (fromEntry) {
      if (!fromEntry) return;
      if (isMatchmakerEntry(fromEntry)) {
        var mmOv = openModal(
          '<h3>먼저 프로필을 선택해 주세요</h3>' +
          '<p class="modal-msg">주선자 계정은 <b>친구를 대신 소개하는 계정</b>이에요. <b>본인이나 친구 프로필을 등록해야</b> 소개팅 활동(사진·대화 요청)을 할 수 있어요 😊</p>' +
          '<p class="modal-msg" style="margin-bottom:8px;">✅ <b>이미 프로필이 있으면</b> — 화면 위쪽 <b>“🔄 누구로 활동할까요”</b>를 눌러 그 프로필로 바꾼 뒤 요청하세요.</p>' +
          '<p class="modal-msg">❎ <b>아직 프로필이 없으면</b> — <b>“신청서 작성”</b> 탭에서 본인 프로필을 만들거나 친구를 소개(등록)하면 요청할 수 있어요.</p>' +
          '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">확인</button></div>'
        );
        mmOv.querySelector('#modal-ok').addEventListener('click', function () { closeModal(mmOv); });
        mmOv.addEventListener('click', function (e) { if (e.target === mmOv) closeModal(mmOv); });
        return;
      }
      if (fromEntry.id === toId) return modalNotice('안내', '본인에게는 요청할 수 없어요.');
      if (fromEntry.managedBy && target.managedBy && fromEntry.managedBy === target.managedBy) {
        return modalNotice('안내', '같은 주선자 소속끼리는 사진·대화 요청을 보낼 수 없어요.');
      }
      if (isPhoto && canViewPhotoOf(state, fromEntry.id, toId)) {
        return modalNotice('안내', escapeHtml(target.nickname) + '님 사진을 이미 볼 수 있어요. 명단에서 바로 확인하세요.');
      }
      var existingReq = (state.dateRequests || []).find(function (req) {
        return req.fromId === fromEntry.id && req.toId === toId && (req.type || 'contact') === type &&
          (req.hiddenBy || []).indexOf(fromEntry.id) < 0;
      });
      if (existingReq) {
        var st = reqStatus(existingReq);
        if (st === 'rejected') return modalNotice('안내', escapeHtml(target.nickname) + '님이 이 요청을 거절했어요.');
        return modalNotice('안내', '이미 ' + escapeHtml(target.nickname) + '님에게 ' + actionText + '을 보냈어요. "메시지함" 탭에서 확인할 수 있어요.');
      }
      /* 하루 요청 한도 (프로필별·KST·유형별) — 무분별한 요청 방지 */
      var todayK = kstDay(new Date().toISOString());
      var typeLimit = isPhoto ? DAILY_PHOTO_LIMIT : DAILY_TALK_LIMIT;
      var sentTodayType = (currentState.dateRequests || []).filter(function (req) {
        return req.fromId === fromEntry.id && (req.type || 'contact') === type && req.submittedAt && kstDay(req.submittedAt) === todayK;
      }).length;
      if (sentTodayType >= typeLimit) {
        modalNotice('오늘 ' + actionText + ' 한도 도달', '하루에 보낼 수 있는 ' + actionText + '은 ' + typeLimit + '건이에요. 오늘은 모두 사용했어요. 내일 다시 신중하게 보내주세요 🙂 (이미 보낸 요청의 답장·수락은 계속 받을 수 있어요.)');
        return;
      }
      var remainToday = typeLimit - sentTodayType; /* 이번 건 포함 남은 횟수 */
      /* 실제 신청 노트 모달 — 아래 "사진 먼저 볼까요?" 게이트 뒤에서 호출 */
      function proceedToNote() {
      var icon = isPhoto ? '📷' : '💌';
      /* 주선자가 친구 프로필로 전환해 대신 요청 중이면 예시 문구를 "친구 대신" 톤으로 */
      var isViaMm = !!(fromEntry.managedBy && fromEntry.managedBy === currentUser.id && !fromEntry.ownerSelf && isMatchmakerEntry(myAuthEntry(state)));
      var noteEx = isPhoto
        ? (isViaMm ? '예) 안녕하세요! 제가 친구를 대신해 사진 요청드려요. 좋은 인연이 될 것 같아 조심스레 연락드립니다 :)' : '예) 안녕하세요! 프로필 보고 관심이 있어서 사진 요청 드립니다. 제 사진도 공개해드렸으니, 보시고 편하게 답변 주세요.')
        : (isViaMm ? '예) 안녕하세요! 제가 친구를 대신해 대화 신청드려요. 두 분이 잘 맞을 것 같아 조심스레 소개드려요 :)' : '예) 안녕하세요! 저랑 공통점이 있어서 꼭 한 번 대화해보고 싶어요 :)');
      var noteOverlay = openModal(
        '<h3>' + icon + ' ' + escapeHtml(target.nickname) + '님에게 ' + actionText + '</h3>' +
        (isViaMm ? '<p class="modal-msg" style="background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;color:var(--gold);padding:7px 10px;margin:0 0 8px;">🤝 <b>' + escapeHtml(fromEntry.nickname) + '</b>님을 대신해 주선자로 요청하는 중이에요. 받는 분께 <b>주선자가 대신</b>임이 안내돼요.</p>' : '') +
        '<p class="modal-msg">' + (isPhoto ? '수락하면 <b>서로 사진이 공개</b>돼요. ' : '수락하면 <b>앱 안에서 채팅</b>으로 대화할 수 있어요 (대화 후 번호/카톡 교환 추천해요). ') + '간단한 인사·요청 이유를 꼭 남겨주세요 <b>(최소 10자)</b>.</p>' +
        (isPhoto ? '' : '<p class="modal-msg" style="font-size:0.82rem;color:var(--muted);margin:-2px 0 6px;">대화 내용은 안전·분쟁 대비를 위해 서버에 보관되지만, 관리자 화면에는 공개되지 않아요.</p>') +
        '<p class="modal-msg" style="color:var(--gold);font-size:0.82rem;margin:-2px 0 6px;">오늘 ' + actionText + ' 남은 횟수: <b>' + remainToday + '/' + typeLimit + '</b></p>' +
        '<textarea class="modal-input" id="modal-note" rows="3" maxlength="200" placeholder="' + noteEx + '"></textarea>' +
        '<p id="modal-note-warn" class="modal-msg" style="color:var(--accent);margin:4px 0 0;font-size:0.82rem;" hidden>최소 10자 이상 남겨주세요.</p>' +
        '<div class="modal-actions">' +
          '<button type="button" class="card-btn" id="modal-cancel">취소</button>' +
          '<button type="button" class="card-btn primary" id="modal-ok">요청하기</button>' +
          (isPhoto ? '<button type="button" class="card-btn approve" id="modal-ok-reveal">요청 + 내 사진 공개</button>' : '') +
        '</div>' +
        (isPhoto ? '<p class="modal-msg" style="color:var(--muted);font-size:0.8rem;margin:6px 0 0;">“요청 + 내 사진 공개”를 누르면 상대가 수락 전에도 내 사진을 볼 수 있어요 (수락률↑).</p>' : '')
      );
      new Promise(function (resolve) {
        function finish(val) { closeModal(noteOverlay); resolve(val); }
        var noteEl = noteOverlay.querySelector('#modal-note');
        var warnEl = noteOverlay.querySelector('#modal-note-warn');
        function submit(reveal) {
          var v = noteEl.value.trim();
          if (v.length < 10) { warnEl.hidden = false; noteEl.focus(); return; } /* 코멘트 최소 10자 필수 */
          finish({ note: v, reveal: reveal });
        }
        noteOverlay.querySelector('#modal-cancel').addEventListener('click', function () { finish(null); });
        noteOverlay.querySelector('#modal-ok').addEventListener('click', function () { submit(false); });
        var revBtn = noteOverlay.querySelector('#modal-ok-reveal');
        if (revBtn) revBtn.addEventListener('click', function () { submit(true); });
        noteOverlay.addEventListener('click', function (e) { if (e.target === noteOverlay) finish(null); });
      }).then(function (result) {
        if (!result) return;
        /* 대화 신청은 번호를 공유하지 않음 — 수락되면 앱 내 채팅으로만 대화 */
        var req = {
          id: genId(), type: type, fromId: fromEntry.id, toId: toId,
          note: result.note || '', submittedAt: new Date().toISOString()
        };
        /* 주선자가 친구 대신 보내는 요청이면 표시 → 받는 사람에게 안내, 채팅서 발신 주체 구분 */
        if (fromEntry.managedBy && fromEntry.managedBy === currentUser.id && !fromEntry.ownerSelf && isMatchmakerEntry(myAuthEntry(state))) req.viaMm = true;
        if (isPhoto && result.reveal) req.fromRevealed = true; /* 요청과 동시에 내 사진 미리 공개 */
        return stateRef.update({
          dateRequests: firebase.firestore.FieldValue.arrayUnion(req)
        }).then(function () {
          appendLog('request', fromEntry.nickname, actionText + ' → ' + target.nickname + (req.fromRevealed ? ' (사진 공개)' : ''));
          notifyAdmin(actionText, fromEntry.nickname + '님이 ' + target.nickname + '님에게 ' + actionText + '을 보냈어요!');
          return refreshNow();
        }).then(function () {
          modalNotice('요청 완료', target.nickname + '님에게 ' + actionText + '을 보냈어요!' + (req.fromRevealed ? ' 내 사진도 함께 공개했어요.' : '') + ' "메시지함" 탭에서 상태를 볼 수 있어요.');
        });
      }).catch(function (err) {
        modalNotice('오류', '요청에 실패했어요: ' + (err.message || err));
      });
      } /* end proceedToNote */
      /* 부드러운 확인: 대화 신청인데 아직 상대 사진을 못 봤고, 상대에게 사진이 있으면 → 사진 먼저 권유(막지 않음) */
      if (!isPhoto && !canViewPhotoOf(state, fromEntry.id, toId) && photoCountOf(target) > 0) {
        var pgOv = openModal(
          '<h3>📷 사진을 먼저 보고 시작할까요?</h3>' +
          '<p class="modal-msg">아직 <b>' + escapeHtml(target.nickname) + '</b>님의 사진을 보지 않았어요. 사진을 먼저 보면 서로 더 편하게 시작할 수 있어요. 그래도 괜찮다면 사진 없이 바로 대화를 신청할 수 있어요 🙂</p>' +
          '<div class="modal-actions" style="flex-wrap:wrap;gap:6px;">' +
            '<button type="button" class="card-btn" id="pg-cancel">취소</button>' +
            '<button type="button" class="card-btn" id="pg-skip">사진 없이 대화 신청</button>' +
            '<button type="button" class="card-btn primary" id="pg-photo">📷 사진 먼저 요청</button>' +
          '</div>'
        );
        pgOv.querySelector('#pg-cancel').addEventListener('click', function () { closeModal(pgOv); });
        pgOv.querySelector('#pg-photo').addEventListener('click', function () { closeModal(pgOv); handleRequest(toId, 'photo'); });
        pgOv.querySelector('#pg-skip').addEventListener('click', function () { closeModal(pgOv); proceedToNote(); });
        pgOv.addEventListener('click', function (e) { if (e.target === pgOv) closeModal(pgOv); });
        return;
      }
      proceedToNote();
    });
  }

  /* 승인 시 함께 보낼 기본 안내 메시지 (관리자가 수정 가능) — 일반 회원 / 주선자 구분 */
  var APPROVE_MSG_DEFAULT = '축하해요! 프로필이 승인됐어요 🎉 이제 명단에서 마음에 드는 분께 📷 사진 요청·💌 대화 신청을 보낼 수 있어요. 상단 🔔 알림을 켜두면 소식을 바로 받아볼 수 있어요. 좋은 인연 되시길 바라요!';
  var APPROVE_MSG_MM = '주선자 등록이 승인됐어요 🤝 이제 "신청서 작성"에서 친구를 대신 소개하고, 친구에게 온 사진·대화 요청과 승인을 대신 관리할 수 있어요. 친구에게 1일 임시 PIN을 발급하거나 독립 계정으로 전환해 줄 수도 있어요. 잘 부탁드려요!';
  function handleApprove(id) {
    var pend = ((currentState && currentState.pendingEntries) || []).find(function (e) { return e.id === id; });
    if (!pend) return;
    var nick = pend.nickname || '';
    var hint = pend.isMatchmaker ? APPROVE_MSG_MM : APPROVE_MSG_DEFAULT;
    modalMessage('신청 승인', nick + '님(' + (pend.isMatchmaker ? '주선자' : '일반 회원') + ')을 승인해요. 필요하면 안내 메시지를 남길 수 있어요. (비워두면 메시지 없이 조용히 승인돼요)', '승인', 'approve', hint, false, '').then(function (welcome) {
      if (welcome === null || welcome === undefined) return; /* 취소 */
      welcome = (welcome || '').trim();
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var state = doc.data();
          var idx = (state.pendingEntries || []).findIndex(function (e) { return e.id === id; });
          if (idx < 0) return;
          var entry = state.pendingEntries.splice(idx, 1)[0];
          if (!entry.serial) entry.serial = nextSerial(state);
          delete entry.rejectedReason; delete entry.rejectedAt; delete entry.heldReason; delete entry.heldAt; /* 승인 시 반려/보류 흔적 제거 */
          if (!entry.lastSeenAt) entry.lastSeenAt = new Date().toISOString(); /* 승인 시점을 최초 접속 기록으로 (이후 실제 접속 시 갱신) */
          var newEntries = (state.entries || []).concat([entry]);
          tx.update(stateRef, { pendingEntries: state.pendingEntries, entries: newEntries });
        });
      }).then(function () {
        appendLog('admin', '관리자', '신청 승인 · ' + nick);
        if (welcome) { try { return sendMessageTo(id, 'admin', welcome); } catch (e) {} }
      }).then(function () {
        return refreshNow();
      }).then(function () {
        modalNotice('승인 완료', nick + '님을 승인했어요.' + (welcome ? ' 안내 메시지도 보냈어요.' : ''));
      }).catch(function (err) {
        modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));

  /* 관리자: 신청 보류 (사유 남김). 신청자는 로그인 가능·메시지함에 사유 표시, 명단엔 미등록 */
  function handleHoldApplication(id) {
    var e = ((currentState && currentState.pendingEntries) || []).find(function (x) { return x.id === id; });
    if (!e) return;
    modalMessage('신청 보류', e.nickname + '님 신청을 보류하고, 신청자에게 전할 사유를 남겨주세요. (신청자는 로그인은 되지만 명단엔 아직 안 올라가요)', '보류하기', 'primary', '예: 사진이 흐려요. 다른 사진으로 다시 등록해 주세요.', true).then(function (msg) {
      if (msg === null || msg === undefined) return;
      msg = (msg || '').trim();

      db.runTransaction(function (tx) {

  /* 관리자: 승인된 회원 관리 — 보류(명단 내림, 되돌릴 수 있음) 또는 완전 삭제 선택 */
  function handleAdminManage(id) {

      '<h3>' + escapeHtml(e.nickname) + '님 관리</h3>' +

      '<div class="modal-actions" style="flex-direction:column;gap:8px;align-items:stretch;">' +
        '<button type="button" class="card-btn primary" id="am-hold" style="width:100%;">📌 보류 (명단에서 내림 · 되돌릴 수 있음)</button>' +
        '<button type="button" class="card-btn danger" id="am-del" style="width:100%;">🗑 완전 삭제 (되돌릴 수 없음)</button>' +

      '</div>'
    );
    ov.querySelector('#am-hold').addEventListener('click', function () { closeModal(ov); handleHoldApproved(id); });
    ov.querySelector('#am-del').addEventListener('click', function () { closeModal(ov); handleDelete(id); });
    ov.querySelector('#modal-cancel').addEventListener('click', function () { closeModal(ov); });
    ov.addEventListener('click', function (ev) { if (ev.target === ov) closeModal(ov); });
  }
  /* 관리자: 승인 회원을 보류로 되돌림 (entries → pendingEntries, heldReason). 재승인 시 고유번호 유지 */
  function handleHoldApproved(id) {

    modalMessage('회원 보류', e.nickname + '님을 명단에서 내리고(보류) 사유를 남겨주세요. 로그인은 되지만 명단엔 안 보여요. 나중에 "승인 대기"에서 다시 승인할 수 있어요.', '보류하기', 'primary', '예: 사진/정보 확인이 필요해요.', true).then(function (msg) {

  function handleApproveRequest(id) {
    var state = currentState;
    var req = (state.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req) return;
    var reqType = req.type || 'contact';
    modalMessage('요청 승인 (관리자)', '신청자에게 전달할 답장을 꼭 남겨주세요 (최소 10자).', '승인', 'approve', '예: 좋은 인연 되길 바라요! 편하게 대화 나눠보세요 :)', false, null, 10).then(function (replyMsg) {
      if (replyMsg === null) return;
      if (reqType === 'photo') {
        db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs });
          });
        }).then(function () {
          appendLog('admin', '관리자', '사진 요청 승인');
          return refreshNow();
        }).catch(function (err) {
          modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
        });
        return;
      }
      var fromEntry = (state.entries || []).find(function (e) { return e.id === req.fromId; });
      var toEntry = (state.entries || []).find(function (e) { return e.id === req.toId; });
      var decryptPromises = [];
      if (fromEntry && fromEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, fromEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      if (toEntry && toEntry.contactEnc && adminPrivateKey) {
        decryptPromises.push(decryptWithAdmin(adminPrivateKey, toEntry.contactEnc).catch(function () { return ''; }));
      } else { decryptPromises.push(Promise.resolve('')); }
      Promise.all(decryptPromises).then(function (contacts) {
        return db.runTransaction(function (tx) {
          return tx.get(stateRef).then(function (doc) {
            var s = doc.data();
            var reqs = (s.dateRequests || []).map(function (r) {
              if (r.id === id) {
                var copy = JSON.parse(JSON.stringify(r));
                copy.approved = true; copy.held = false;
                copy.revealedContact = { from: contacts[0], to: contacts[1] };
                if (replyMsg) copy.approveMessage = replyMsg;
                return copy;
              }
              return r;
            });
            tx.update(stateRef, { dateRequests: reqs, connEver: connEverNext(s), connLog: connLogAdd(s, req.fromId, req.toId) }); /* 누적 연결 +1 · 이력 기록 */
          });
        });
      }).then(function () {
        appendLog('admin', '관리자', '대화 신청 수락');
        return refreshNow();
      }).catch(function (err) {
        modalNotice('오류', '승인에 실패했어요: ' + (err.message || err));
      });
    });
  }

  /* viewerId 가 targetId 의 사진을 볼 수 있는가:
     (1) 내가 보낸 사진 요청을 상대가 승인, 또는 (2) 상대가 나에게 자기 사진을 직접 공개(fromRevealed) */
  function canViewPhotoOf(state, viewerId, targetId) {
    return (state.dateRequests || []).some(function (req) {
      if ((req.type || 'contact') !== 'photo') return false;
      /* 승인된 사진 요청은 양방향 상호 공개 (요청자·수신자 모두 서로 사진을 봄) — "보고 튀기" 방지 */
      if (req.approved && ((req.fromId === viewerId && req.toId === targetId) || (req.fromId === targetId && req.toId === viewerId))) return true;
      if (req.fromRevealed && req.fromId === targetId && req.toId === viewerId) return true;
      return false;
    });
  }
  /* 번호는 승인 시 상호 공개 → 두 사람 사이 승인된 번호 요청이 있으면 서로 볼 수 있음 */
  function canViewContactOf(state, viewerId, targetId) {
    return (state.dateRequests || []).some(function (req) {
      if ((req.type || 'contact') !== 'contact' || !req.approved) return false;
      return (req.fromId === viewerId && req.toId === targetId) || (req.fromId === targetId && req.toId === viewerId);
    });
  }
  /* 관리자: 이 회원이 볼 수 있는 사진/번호 관리 팝업 (주체 = targetId가 "보는 사람") */
  function openPermPopup(targetId, kind) {
    if (!isAdminUnlocked) return;
    var state = currentState;
    var target = (state.entries || []).find(function (e) { return e.id === targetId; });
    if (!target) return;
    var isPhoto = kind === 'photo';
    var others = (state.entries || []).filter(function (e) { return e.id !== targetId; })
      .sort(function (a, b) { return (b.serial || 0) - (a.serial || 0); });
    var rows = others.map(function (x) {
      /* targetId(이 사람)가 x의 사진/번호를 볼 수 있는가 */
      var has = isPhoto ? canViewPhotoOf(state, targetId, x.id) : canViewContactOf(state, targetId, x.id);
      return '<label style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;">' +
        '<input type="checkbox" data-permtoggle="1" data-viewer="' + escapeHtml(targetId) + '" data-target="' + escapeHtml(x.id) + '" data-kind="' + kind + '"' + (has ? ' checked' : '') + ' style="width:17px;height:17px;accent-color:var(--accent);flex:none;">' +
        '<span><b style="font-variant-numeric:tabular-nums;">' + escapeHtml(formatUid(x) || '—') + '</b> ' + escapeHtml(x.nickname) + (x.testAccount ? ' 🧪' : '') + '</span>' +
      '</label>';
    }).join('');
    var overlay = openModal(
      '<h3>' + (isPhoto ? '📷 사진 열람 권한' : '💬 채팅(대화 연결) 권한') + '</h3>' +
      (isPhoto
        ? '<p class="modal-msg"><b>' + escapeHtml(target.nickname) + '</b>님이 볼 수 있는 사진이에요. 체크한 사람의 사진을 ' + escapeHtml(target.nickname) + '님이 볼 수 있어요.</p>'
        : '<p class="modal-msg"><b>' + escapeHtml(target.nickname) + '</b>님이 채팅할 수 있는(대화 연결된) 사람이에요. <span style="color:var(--muted);font-size:0.82rem;">회원끼리 대화 신청·수락으로만 연결돼요. 여기선 <b>해제(회수)</b>만 가능해요.</span></p>') +
      '<div style="max-height:48vh;overflow-y:auto;">' + (rows || '<p class="sub">다른 회원이 없어요.</p>') + '</div>' +
      '<div class="modal-actions"><button type="button" class="card-btn primary" id="modal-ok">닫기</button></div>'
    );
    overlay.classList.add('wide-modal');
    overlay.querySelector('#modal-ok').addEventListener('click', function () { closeModal(overlay); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(overlay); });
  }
  /* 관리자: 권한 부여/회수 */
  function setPermission(kind, viewerId, targetId, grant, cb) {
    if (!isAdminUnlocked) return;
    if (kind === 'contact' && grant) {
      modalNotice('안내', '번호는 회원끼리 요청·승인으로만 공유돼요. 관리자가 직접 부여할 수는 없어요.');
      if (cb) cb.checked = false;
      return;
    }
    db.runTransaction(function (tx) {
      return tx.get(stateRef).then(function (doc) {
        var s = doc.data();
        var reqs = s.dateRequests || [];
        if (kind === 'photo') {
          if (grant) {
            var found = false;
            reqs = reqs.map(function (r) {
              if ((r.type || 'contact') === 'photo' && r.fromId === viewerId && r.toId === targetId) {
                found = true; var c = JSON.parse(JSON.stringify(r)); c.approved = true; c.rejected = false; c.held = false; c.decidedAt = new Date().toISOString(); return c;
              }
              return r;
            });
            if (!found) reqs = reqs.concat([{ id: genId(), type: 'photo', fromId: viewerId, toId: targetId, approved: true, adminGranted: true, decidedAt: new Date().toISOString(), submittedAt: new Date().toISOString() }]);
          } else {
            reqs = reqs.map(function (r) {
              if ((r.type || 'contact') !== 'photo') return r;
              if (r.fromId === viewerId && r.toId === targetId && r.approved) { var c = JSON.parse(JSON.stringify(r)); c.approved = false; return c; }
              if (r.fromId === targetId && r.toId === viewerId && r.fromRevealed) { var c2 = JSON.parse(JSON.stringify(r)); c2.fromRevealed = false; return c2; }
              return r;
            });
          }
        } else { /* contact revoke */
          reqs = reqs.map(function (r) {
            if ((r.type || 'contact') !== 'contact' || !r.approved) return r;
            if ((r.fromId === viewerId && r.toId === targetId) || (r.fromId === targetId && r.toId === viewerId)) { var c = JSON.parse(JSON.stringify(r)); c.approved = false; c.userApproved = false; return c; }
            return r;
          });
        }
        var _p2 = { dateRequests: reqs };
        if (kind !== 'photo' && !grant) { var _cl = connLogRevoke(s, viewerId, targetId); if (_cl) _p2.connLog = _cl; }
        tx.update(stateRef, _p2);
      });
    }).then(function () {
      appendLog('admin', '관리자', (kind === 'photo' ? '사진' : '번호') + ' 권한 ' + (grant ? '부여' : '회수') + ' · ' + nickForEntry(currentState, viewerId) + (grant ? ' → ' : ' ✕ ') + nickForEntry(currentState, targetId));
      return refreshNow();
    }).catch(function (err) { modalNotice('오류', '변경 실패: ' + (err.message || err)); });
  }
  /* 보낸 사진 요청에서 "내 사진 공개" → 상대가 내 사진을 볼 수 있게 함 */
  function handleRevealMine(id) {
    var me = findMyEntry(currentState);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    var req = (currentState.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req || req.fromId !== me.id || (req.type || 'contact') !== 'photo' || req.fromRevealed) return;
    var toName = nickForEntry(currentState, req.toId);
    modalConfirm('내 사진 공개', escapeHtml(toName) + '님에게 내 사진을 공개할까요? 공개하면 상대가 바로 내 사진을 볼 수 있어요.', '공개', 'primary').then(function (ok) {
      if (!ok) return;
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var reqs = (s.dateRequests || []).map(function (r) {
            if (r.id === id) { var c = JSON.parse(JSON.stringify(r)); c.fromRevealed = true; c.fromRevealedAt = new Date().toISOString(); return c; }
            return r;
          });
          tx.update(stateRef, { dateRequests: reqs });
        });
      }).then(function () {
        appendLog('request', me.nickname, '내 사진 공개 → ' + toName);
        return refreshNow();
      }).then(function () {
        modalNotice('공개 완료', escapeHtml(toName) + '님이 이제 내 사진을 볼 수 있어요.');
      }).catch(function (err) { modalNotice('오류', '공개에 실패했어요: ' + (err.message || err)); });
    });
  }
  /* 관리자: 체크박스로 테스트 계정 지정/해제 (조용히 저장) */
  function handleSetTest(id, makeTest) {
    if (!isAdminUnlocked) return;
    var entry = (currentState.entries || []).find(function (e) { return e.id === id; });
    if (!entry || !!entry.testAccount === !!makeTest) return;
    db.runTransaction(function (tx) {
      return tx.get(stateRef).then(function (doc) {
        var s = doc.data();
        var entries = (s.entries || []).map(function (e) {
          if (e.id !== id) return e;
          var c = JSON.parse(JSON.stringify(e));
          /* 상호배타: 테스트로 지정하면 보관 플래그 제거 (동시 설정 방지) */
          if (makeTest) { c.testAccount = true; delete c.deactivated; delete c.deactivatedReason; delete c.deactivatedAt; delete c.deactivateRequested; delete c.deactivateReqAt; delete c.deactivateReason; }
          else delete c.testAccount;
          return c;
        });
        tx.update(stateRef, { entries: entries });
      });
    }).then(function () {
      appendLog('admin', '관리자', (makeTest ? '테스트 계정 지정 · ' : '테스트 계정 해제 · ') + entry.nickname);
    }).catch(function () {});
  }
  /* 관리자: 계정 상태 직접 지정 (일반 / 테스트 / 비활성화) */
  function handleSetAccountStatus(id, status) {
    if (!isAdminUnlocked) return;
    var entry = (currentState.entries || []).find(function (e) { return e.id === id; });
    if (!entry) return;
    var cur = entry.deactivated ? 'archived' : (entry.testAccount ? 'test' : 'normal');
    if (cur === status) return;
    /* 보관 → 일반: 재활성화(대리 친구 독립 전환·PIN 1234 리셋 포함) 로직 재사용 */
    if (cur === 'archived' && status === 'normal') { handleReactivate(id); return; }
    var labels = { normal: '일반', test: '테스트', archived: '비활성화(보관)' };
    function apply() {
      db.runTransaction(function (tx) {
        return tx.get(stateRef).then(function (doc) {
          var s = doc.data();
          var entries = (s.entries || []).map(function (e) {
            if (e.id !== id) return e;
            var c = JSON.parse(JSON.stringify(e));
            delete c.testAccount; delete c.deactivated; delete c.deactivatedReason; delete c.deactivatedAt;
            delete c.deactivateRequested; delete c.deactivateReqAt; delete c.deactivateReason;
            if (status === 'test') c.testAccount = true;
            else if (status === 'archived') { c.deactivated = true; c.deactivatedReason = entry.deactivatedReason || entry.deactivateReason || ''; c.deactivatedAt = new Date().toISOString(); }
            return c;
          });
          tx.update(stateRef, { entries: entries });
        });
      }).then(function () {
        appendLog('admin', '관리자', '계정 상태 → ' + labels[status] + ' · ' + entry.nickname);
        return refreshNow();
      }).catch(function (err) { modalNotice('오류', '변경 실패: ' + (err.message || err)); });
    }
    if (status === 'archived') {
      modalConfirm('비활성화(보관)', escapeHtml(entry.nickname) + '님을 보관 상태로 전환할까요? 명단에서 숨겨져요. (연결 회원 안내는 보관 계정 목록에서 보낼 수 있어요)', '보관 전환', 'primary').then(function (ok) { if (ok) apply(); });
    } else { apply(); }
  }
  /* ---- user (recipient) decisions on incoming requests ---- */
  /* 받은 요청 승인 취소 → 다시 대기 상태로, 상대 접근 차단 */
  function handleRevokeApprove(id) {
    var me = findMyEntry(currentState);
    if (!me) return modalNotice('로그인 필요', '먼저 로그인해주세요.');
    var req = (currentState.dateRequests || []).find(function (r) { return r.id === id; });
    if (!req || req.toId !== me.id) return;
    var st = reqStatus(req);
    if (st !== 'approved' && st !== 'user_approved') return;

  function openGallery(photos, startIdx) {
    var idx = startIdx || 0;
    var overlay = document.createElement('div');
    overlay.className = 'gallery-overlay';
    function render() {
      var html = '<img class="gallery-img" src="' + photos[idx] + '" alt="사진 ' + (idx + 1) + '">';
      if (photos.length > 1) {
        html += '<div class="gallery-counter">' + (idx + 1) + ' / ' + photos.length + '</div>';
        html += '<button class="gallery-nav gallery-nav--prev" id="gal-prev">&#8249;</button>';
        html += '<button class="gallery-nav gallery-nav--next" id="gal-next">&#8250;</button>';
      }
      html += '<button class="gallery-close" id="gal-close">&times;</button>';
      overlay.innerHTML = html;
    }
    render();
    document.body.appendChild(overlay);
    function closeGallery() {
      if (!overlay.parentNode) return;
      overlay.remove();
      popOverlay(overlay);
    }
    pushOverlay(overlay, closeGallery);
    overlay.addEventListener('click', function (e) {
      if (e.target.id === 'gal-prev') { idx = (idx - 1 + photos.length) % photos.length; render(); return; }
      if (e.target.id === 'gal-next') { idx = (idx + 1) % photos.length; render(); return; }
      if (e.target.id === 'gal-close' || e.target === overlay) { closeGallery(); return; }
    });
    overlay.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeGallery();
      if (e.key === 'ArrowLeft' && photos.length > 1) { idx = (idx - 1 + photos.length) % photos.length; render(); }
      if (e.key === 'ArrowRight' && photos.length > 1) { idx = (idx + 1) % photos.length; render(); }
    });
    overlay.setAttribute('tabindex', '0');
    overlay.focus();
  }

  function handleAdminResetPin(id) {
    if (!isAdminUnlocked || !adminPrivateKey) return modalNotice('안내', '관리자 모드에서만 가능해요.');

      var contactP = entry.contactEnc ? decryptWithAdmin(adminPrivateKey, entry.contactEnc).catch(function () { return null; }) : Promise.resolve(null);
      contactP.then(function (contact) {
        return Promise.all([
          makePinAuth(r.p1),

        ]).then(function (res) {
          return db.runTransaction(function (tx) {

  function resizeImage(file, maxW, maxH, quality, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var baseW = img.width, baseH = img.height;
        if (baseW > maxW || baseH > maxH) {
          var ratio = Math.min(maxW / baseW, maxH / baseH);
          baseW = Math.round(baseW * ratio);
          baseH = Math.round(baseH * ratio);
        }
        /* 저장 용량 상한 보장: 목표(300KB) 이하가 될 때까지
           ① 원본 캔버스에서 품질을 0.82→0.45로 낮춰 재인코딩(해상도 유지, 2세대 손실 없음)
           ② 그래도 크면 해상도를 15%씩 줄여 재시도 (노이즈 많은 극단적 사진 대비) */
        var out = null, scale = 1;
        for (var attempt = 0; attempt < 7; attempt++) {
          var w = Math.max(1, Math.round(baseW * scale));
          var h = Math.max(1, Math.round(baseH * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var q = quality;
          out = canvas.toDataURL('image/jpeg', q);
          while (out.length > PHOTO_MAX_BYTES && q > 0.45) {
            q = Math.round((q - 0.05) * 100) / 100;
            out = canvas.toDataURL('image/jpeg', q);
          }
          if (out.length <= PHOTO_MAX_BYTES) break;
          scale *= 0.85;
        }
        cb(out);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
